  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header.bar { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
    header.bar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    header.bar h1 { font-size: 15px; font-weight: 700; margin-right: auto; }
    header.bar span.badge { font-size: 11px; background: #00aeef; color: #fff; padding: 3px 8px; border-radius: 999px; }
    .tabs-wrap { overflow-x: auto; padding-bottom: 4px; }
    .tabs { display: flex; gap: 6px; min-width: min-content; }
    .tabs button { border: 1px solid #475569; background: transparent; color: #cbd5e1; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .tabs button.active { background: #00aeef; border-color: #00aeef; color: #fff; }
    .viewer { padding: 20px; max-width: 1500px; margin: 0 auto; }
    .hint { font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    .canvas-wrap { position: relative; display: inline-block; max-width: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,.4); }
    .canvas-wrap img { display: block; max-width: 100%; height: auto; }
    .hotspot { position: absolute; border: 2px solid #00aeef; background: rgba(0,174,239,.12); cursor: pointer; border-radius: 4px; z-index: 2; }
    .hotspot:hover { background: rgba(0,174,239,.35); z-index: 3; }
    .hotspot::after { content: attr(data-label); position: absolute; left: 0; top: -24px; font-size: 10px; background: #00aeef; color: #fff; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar label { font-size: 12px; color: #94a3b8; }
    .toolbar input { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 13px; min-width: 200px; }
    .toolbar button { background: #334155; border: none; color: #e2e8f0; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { background: #475569; }
    .hotspot-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; cursor: pointer; }
    .meta { font-size: 11px; color: #64748b; margin-top: 8px; }
  </style>
</head>

      <label class="hotspot-toggle"><input type="checkbox" id="show-hotspots" checked /> Hiện hotspot (Home)</label>
    </div>
    <p class="hint" id="hint"></p>
    <div class="canvas-wrap" id="canvas"></div>
    <p class="meta" id="meta"></p>

    let currentId = 'home';
    let showHotspots = true;

    const tabs = document.getElementById('tabs');
    const canvas = document.getElementById('canvas');
    const hint = document.getElementById('hint');
    const meta = document.getElementById('meta');
    const backBtn = document.getElementById('back-btn');
    const filterInput = document.getElementById('filter');
    const hotspotToggle = document.getElementById('show-hotspots');

    function renderTabs(filter = '') {
      const q = filter.trim().toLowerCase();
      tabs.innerHTML = '';
      PAGES.filter(p => !q || p.label.toLowerCase().includes(q) || p.url.toLowerCase().includes(q))
        .forEach(p => {
          const btn = document.createElement('button');
          btn.textContent = p.label.length > 28 ? p.label.slice(0, 25) + '…' : p.label;
          btn.title = p.label + ' (' + p.url + ')';
          btn.dataset.id = p.id;
          btn.classList.toggle('active', p.id === currentId);
          btn.onclick = () => show(p.id);
          tabs.appendChild(btn);
        });
    }

    backBtn.onclick = () => show('home');
    filterInput.oninput = () => renderTabs(filterInput.value);
    hotspotToggle.onchange = () => { showHotspots = hotspotToggle.checked; show(currentId); };

    function show(id) {
      currentId = id;
      const page = PAGES.find(p => p.id === id);
      if (!page) return;
      renderTabs(filterInput.value);
      backBtn.hidden = id === 'home';
      hint.textContent = id === 'home'
        ? 'Click khung xanh trên ảnh Home để mở màn đích. Tab trên hoặc ô tìm kiếm để chuyển trang.'
        : page.label;
      meta.textContent = page.url || '/';

      canvas.innerHTML = '';
      const img = document.createElement('img');
      img.src = page.image + '?t=' + Date.now();
      img.alt = page.label;
      img.onload = () => {
        if (id !== 'home' || !showHotspots) return;
        (page.hotspots || []).forEach(h => {
          const el = document.createElement('div');
          el.className = 'hotspot';
          el.dataset.label = h.label;
          if (h.xPct != null) {
            el.style.left = (h.xPct * 100) + '%';
            el.style.top = (h.yPct * 100) + '%';
            el.style.width = 'max(' + (h.wPct * 100) + '%, 8px)';
            el.style.height = 'max(' + (h.hPct * 100) + '%, 8px)';
          } else {
            const scale = img.clientWidth / img.naturalWidth;
            el.style.left = (h.x * scale) + 'px';
            el.style.top = (h.y * scale) + 'px';
            el.style.width = Math.max(h.width * scale, 8) + 'px';
            el.style.height = Math.max(h.height * scale, 8) + 'px';
          }
          el.title = h.label;
          el.onclick = (e) => { e.stopPropagation(); show(h.targetId); };
          canvas.appendChild(el);
        });
      };
      canvas.appendChild(img);
    }

    renderTabs();
    show('home');
    window.addEventListener('resize', () => show(currentId));
  </script>
